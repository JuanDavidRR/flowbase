<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<title>Flowbase — Schedule and get paid, from one link.</title>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#312e81" />
			<stop offset="100%" stop-color="#4338ca" />
		</linearGradient>
	</defs>
	<rect width="1200" height="630" fill="url(#bg)" />
	<circle cx="1040" cy="120" r="220" fill="#6366f1" opacity="0.25" />
	<circle cx="120" cy="560" r="180" fill="#818cf8" opacity="0.2" />

	<rect x="96" y="96" width="72" height="72" rx="18" fill="#ffffff" />
	<text x="132" y="146" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#312e81" text-anchor="middle">F</text>

	<text x="96" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Flowbase</text>
	<text x="96" y="370" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#e0e7ff">
		Schedule and get paid, from one link.
	</text>
	<text x="96" y="430" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#c7d2fe">
		Booking + payment for freelancers who bill by the call.
	</text>
